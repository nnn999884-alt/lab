# config.yaml 로 복사해서 사용하세요.  cp config.example.yaml config.yaml
mode: paper            # paper(모의) | live(실거래: PENNYBOT_LIVE_CONFIRM=YES 도 필요)
poll_seconds: 20
paper_cash: 2000

# auto: 장 전에 `python -m pennybot screen` 결과(state/watchlist.json)를 사용 (피벗 돌파 전략)
# 수동 목록을 쓰면 갭업 + 시가범위 돌파(ORB) 전략으로 매매
watchlist: auto
# watchlist: [SNDL, BBIG]

strategy:
  min_price: 0.50
  max_price: 5.00
  min_gap_pct: 10
  min_day_volume: 1000000
  min_dollar_volume: 1000000
  max_spread_pct: 2.0
  opening_range_minutes: 15
  min_bar_rvol: 2.0
  stop_loss_pct: 5
  take_profit_pct: 12
  trailing_stop_pct: 4
  max_hold_minutes: 120
  min_volume_pace: 2.0          # 피벗 돌파 시 당일 거래량이 평소 페이스의 2배 이상
  pivot_stop_buffer_pct: 3.0    # 피벗 -3% 이탈 = 돌파 실패 손절
  no_new_entries_after: "15:00"   # 미 동부시간
  flatten_at: "15:50"

risk:
  max_position_usd: 200
  max_open_positions: 3
  max_daily_loss_usd: 100
  max_trades_per_day: 10
  entry_slippage_pct: 0.5
  exit_slippage_pct: 1.0

# Coil & Catalyst 스크리너
screener:
  universe_file: ""             # 비우면 SEC 상장 전종목(OTC 제외). 종목 한 줄씩 적은 파일로 대체 가능
  min_price: 0.50
  max_price: 5.00
  min_dollar_vol_20: 300000
  max_ret_5: 0.50               # 5일 +50% 넘게 오른 종목 = 이미 군중이 들어옴 → 제외
  min_ret_120: -0.85            # 6개월 -85% 이하 = 상습 희석 의심 → 제외
  min_dist_to_pivot: -0.02
  max_dist_to_pivot: 0.15
  catalyst_top_k: 60
  top_n: 15
  workers: 4
  weights:                      # 응축 팩터 가중치 (합이 1일 필요 없음)
    atr_ratio: 0.20             # 변동성 수축
    tightness: 0.15             # 박스 폭
    vol_trend: 0.20             # 거래량 증가
    obv_net: 0.20               # 상승일 거래량 우위
    clv: 0.15                   # 고가권 마감
    dist_to_pivot: 0.10         # 박스 상단 근접
  catalyst:
    offering_block_days: 30     # 증자공시 30일 이내 → 제외
    offering_penalty_days: 90   # 90일 이내 → -25점

# 세션별 데이터 수집기 (python -m pennybot collect)
collector:
  db_path: state/market.db
  markets: [NASDAQ, NYSE, AMEX]
  min_price: 0.20             # 수집은 매매 범위($0.5~$5)보다 넓게
  max_price: 10.0
  price_poll_seconds: 60      # 유니버스 전체 현재가 (200개씩 묶음)
  watch_size: 120             # 호가·1분봉을 촘촘히 받을 종목 수
  orderbook_poll_seconds: 60
  candle_sync_minutes: 30
  ranking_poll_minutes: 10
  edgar_poll_minutes: 5
  news_poll_minutes: 2        # 보도자료 피드
  news_feeds: []              # 비우면 기본 4곳 (pennybot/news.py DEFAULT_FEEDS). 주소가 바뀌면 여기서 교체
  universe_refresh_hours: 24

# 세션 매매 엔진 (python -m pennybot trade) — 숫자는 모두 백테스트 전 초안
trading:
  db_path: state/trading.db
  paper_cash: 2000
  min_price: 0.50
  max_price: 5.00
  max_spread_pct: 3.0
  entry_cutoff_minutes: 30      # 데이마켓 종료 30분 전부터 신규 매수 중단
  forced_exit_minutes: 60       # 정규장 개장 60분 뒤 전량 청산
  max_position_usd: 300
  max_position_pct: 0.05
  risk_per_trade_pct: 0.01
  max_open_positions: 8
  max_daily_loss_usd: 150
  auto_disable_trades: 20       # 최근 20회 평균 손익이 음수면 그 전략 자동 정지
  regime_symbol: IWM
  regime_drop_pct: 1.5          # 데이마켓 중 IWM −1.5% 이하면 신규 매수 중단
  max_weekly_loss_usd: 400      # 최근 7일 실현 손실 한도
  loss_streak_stop: 4           # 4연속 손실이면
  loss_streak_cooldown_hours: 24  # 24시간 신규 매수 쉼
  fee_pct: 0.1                  # 수수료 % (실거래는 토스에서 조회한 값으로 자동 교체)
  backstop: true                # 서버 손절 안전망 (토스 조건주문, PC 가 꺼져도 동작)
  backstop_buffer_pct: 3        # 봇 손절가보다 3% 아래에 감시
  backstop_slippage_pct: 8      # 발동 시 지정가 = 감시가 −8%
  use_stream: true              # 토스 웹소켓 (pip install websocket-client). 끊기면 자동으로 REST
  order_poll_fallback_seconds: 30
  strategies:                   # 바꾸고 싶은 키만 적으면 나머지는 기본값 (전체 목록은 pennybot/config.py)
    runner_overnight:           # 전날 급등 + 희석 여력 낮음 → 데이마켓 매수 → 개장 무렵 매도
      enabled: true
      min_runner_pct: 30        # 전날 정규장 상승률
      min_close_loc: 0.6        # 고가권 마감 (0=저가, 1=고가)
      min_rotation: 0.3         # 거래량 / 발행주식
      max_dilution_score: 45    # 희석 위험 점수 상한 (0~100)
      gap_risk_pct: 35          # 밤사이 최악의 갭 가정 → 수량 계산
      scale_out_pct: 0.5        # 익절가에서 절반만 매도 (1.0 = 전량)
      trail_pct: 8              # 나머지는 고점 대비 −8% 트레일링 (강제 청산 시각까지)
    dilution_catalyst:          # ATM 종료 · 증자 등록 철회 · 공모 철회 · 자사주 매입
      enabled: true
      max_runup_pct: 15
    day_ignition:               # 데이마켓에서 새 호재로 막 움직이기 시작
      enabled: true
      min_move_pct: 5
      max_move_pct: 25
    day_dip:
      enabled: false            # 페니주 급락은 증자·펌프 붕괴인 경우가 많아 기본 꺼짐

# 토스증권 Open API (공식 명세 v1.2.17: docs/toss-openapi-1.2.17.json)
# 키·계좌는 .env 로만 받습니다. 엔드포인트는 코드에 고정돼 있습니다.
toss:
  base_url: https://openapi.tossinvest.com
  token_path: state/toss_token.json   # 수집기·봇이 토큰을 공유 (재발급 시 이전 토큰 무효)

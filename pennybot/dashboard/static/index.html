<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mongbot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2218%22%20fill%3D%22%231d2433%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2219%22%20fill%3D%22none%22%20stroke%3D%22%232f3b5a%22%20stroke-width%3D%222%22/%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2211%22%20fill%3D%22none%22%20stroke%3D%22%232f3b5a%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M32%2032L18%2020A19%2019%200%200%201%2032%2013z%22%20fill%3D%22%234f8cff%22%20opacity%3D%22.35%22/%3E%3Cpath%20d%3D%22M32%2032L47%2020%22%20stroke%3D%22%234f8cff%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2223%22%20r%3D%224.2%22%20fill%3D%22%23f0455a%22/%3E%3Ccircle%20cx%3D%2225%22%20cy%3D%2242%22%20r%3D%222.4%22%20fill%3D%22%23ffd166%22/%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef0f4;--card:#fff;--soft:#f5f6f9;--line:#e3e6ec;--ink:#12151c;--ink2:#4b5463;--ink3:#8a93a3;
  --up:#e5384a;--down:#2f6df0;--acc:#6a4cff;--ok:#0bb37a;--warn:#f0a000;
  --shadow:0 1px 2px rgba(15,20,35,.05),0 10px 30px rgba(15,20,35,.06);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
}
:root[data-theme=dark]{--bg:#0d0f14;--card:#171a21;--soft:#1e222b;--line:#272c37;--ink:#eef0f5;--ink2:#a9b1c1;--ink3:#6f798b;--shadow:none;--up:#ff5468;--down:#5b8cff;--acc:#9c86ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.1px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--down)}.mut{color:var(--ink3)}

/* 앱 프레임 */
.app{display:grid;grid-template-rows:auto 1fr;min-height:100vh;max-width:1760px;margin:0 auto;padding:18px 22px 22px;gap:16px}
.top{display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.6px}
.logo .lg{width:32px;height:32px;display:block}
.logo i{width:30px;height:30px;border-radius:10px;background:conic-gradient(from 210deg,#6a4cff,#e5384a,#f0a000,#6a4cff);display:block;position:relative}
.logo i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--bg)}
.sess{display:flex;align-items:baseline;gap:10px;color:var(--ink2)}
.sess b{font-size:15px;color:var(--ink)}
.spacer{flex:1}
.dots{display:flex;gap:14px;color:var(--ink2);font-size:12px}
.dots span{display:inline-flex;align-items:center;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.dots i.g{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.dots i.r{background:var(--up)}
.chipbtn{padding:6px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:12px;color:var(--ink2)}

.grid{display:grid;grid-template-columns:330px minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);gap:16px;min-height:0}
@media (min-width:1251px){.app{height:100vh}.card.tape,.card.board,.card.det{min-height:0}}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.ch h2{margin:0;font-size:14px;font-weight:800;letter-spacing:-.3px}
.ch .sub{color:var(--ink3);font-size:12px}
.ch .r{margin-left:auto;display:flex;gap:6px}

/* 계좌 띠 */
.acct{grid-column:1/-1;flex-direction:row;align-items:stretch;padding:4px 6px}
.acct>div{padding:14px 22px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.acct>div+div{border-left:1px solid var(--line)}
.acct .v{font-size:24px;font-weight:800;letter-spacing:-.8px;line-height:1.2}
.lab{font-size:12px;color:var(--ink3);font-weight:600}
.acct .spark{flex:1;min-width:160px;padding:10px 18px}
.acct .spark{display:flex;align-items:center}.acct .spark svg{width:100%;height:48px;display:block}
.acct .hold{min-width:260px}
.pos{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.posc{display:block;text-align:left;background:var(--soft);border-radius:12px;padding:8px 12px;min-width:200px;font-size:12.5px}
.posc .ph{display:flex;gap:8px;align-items:baseline}.posc b{font-family:var(--mono)}.posc .ph .lab{margin-left:auto;font-size:11px}
.pbar{height:6px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--down),var(--up))}
.psc{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin-top:3px}
/* 테이프 */
.tape{overflow:hidden}
.tape .list{overflow:auto;padding:0 12px 14px 22px;position:relative;flex:1;min-height:0}
.tape .list::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:var(--line)}
.ev{position:relative;display:block;width:100%;text-align:left;padding:8px 10px 8px 22px;border-radius:12px}
.ev:hover{background:var(--soft)}
.ev::before{content:"";position:absolute;left:-1px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--ink3);border:2px solid var(--card)}
.ev.hot::before{background:var(--up)}.ev.dnk::before{background:var(--down)}.ev.mid::before{background:var(--warn)}
.ev .t{display:flex;gap:8px;align-items:baseline;font-size:11.5px;color:var(--ink3)}
.ev .t b{color:var(--ink);font-size:13px;font-family:var(--mono)}
.ev .x{font-size:12.5px;color:var(--ink3);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;padding:0;font-size:11.5px;font-weight:700;background:none;color:var(--ink2)}
.tag.up{color:var(--up)}
.tag.warn{color:#c58a00}
.tag.dn{color:var(--down)}
.tag.acc{color:var(--acc)}

/* 레이더 보드 */
.board{overflow:hidden}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{padding:5px 13px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink3)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tiles{flex:1;min-height:0;overflow:auto;padding:2px 18px 18px}
.sec{display:flex;align-items:baseline;gap:8px;margin:6px 2px 10px;font-size:12px;color:var(--ink3);font-weight:700}
.sec b{color:var(--ink);font-size:13px}
.focus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.rest{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{position:relative;text-align:left;color:var(--ink);background:var(--soft);border-radius:14px;padding:12px 14px;transition:transform .12s,box-shadow .12s,background .12s;min-width:0}
.tile:hover{transform:translateY(-2px);background:var(--card);box-shadow:0 0 0 1px var(--line),0 10px 24px rgba(15,20,35,.10)}
.tile.sel{background:var(--card);box-shadow:0 0 0 2px var(--ink)}
.tile .r1{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tile .r1>div:first-child{min-width:0;flex:1}.tile .px{flex:none}
.tile .why,.tile.f .why{flex-wrap:nowrap;overflow:hidden}.why span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.why b,.why .lv{flex:none}
.li>div>span:first-child{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li>div{min-width:0}.li>b{flex:none}
.tile .sy{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-weight:700;font-size:14.5px;min-width:0}
.tile .sy::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.tile.live .sy::before{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.tile .ch2{font-family:var(--mono);font-weight:700;font-size:14.5px}
.tile .nm{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tile .meta{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px;font-family:var(--mono)}
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:10px;height:4px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--down)}.pips i.on:nth-child(2){background:color-mix(in srgb,var(--down) 75%,var(--up))}.pips i.on:nth-child(3){background:color-mix(in srgb,var(--down) 50%,var(--up))}.pips i.on:nth-child(4){background:color-mix(in srgb,var(--down) 25%,var(--up))}.pips i.on:nth-child(5){background:var(--up)}
.tile.dim{opacity:.72}
/* 주목 카드 */
.tile.f{background:var(--card);box-shadow:0 0 0 1px var(--line),inset 3px 0 0 var(--c);padding:10px 14px 10px 16px}
.tile.f:hover{box-shadow:0 0 0 1px var(--ink3),inset 3px 0 0 var(--c),0 12px 28px rgba(15,20,35,.12)}
.tile.f.sel{box-shadow:0 0 0 2px var(--ink),inset 3px 0 0 var(--c)}
.tile.f .sy{font-size:16px}.tile.f .sy::before{display:none}
.tile.f .px{text-align:right;font-family:var(--mono);line-height:1.2}
.tile.f .px b{font-size:15px;margin-right:8px}.tile.f .px span{font-size:13px;font-weight:700}
.tile.f .nm{font-size:11.5px}
.imp{display:flex;align-items:center;gap:8px;margin:8px 0 6px;font-size:11.5px;color:var(--ink3);font-weight:600;flex-wrap:wrap}
.imp .gbar{width:64px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.imp .gbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--down),var(--up))}
.imp em{font-style:normal;color:var(--ink);font-family:var(--mono)}
.imp>div{display:inline-flex;gap:5px;align-items:baseline}
.imp>div span{font-size:11px;color:var(--ink3)}
.imp>div b{font-family:var(--mono);font-size:12px;color:var(--ink)}
.imp>div::before{content:"";width:1px;height:10px;background:var(--line);margin-right:3px;align-self:center}
.why{font-size:12px;color:var(--ink2);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.why b{color:var(--warn);letter-spacing:1px}
.why .lv{color:var(--c);font-weight:700}
.legend{display:flex;gap:6px;align-items:center;padding:0 18px 12px;font-size:11px;color:var(--ink3)}
.legend i{width:46px;height:8px;border-radius:4px;background:linear-gradient(90deg,#2f6df0,#8ea9e8 35%,#c9ccd6 50%,#f09aa4 65%,#e5384a)}

/* 상세 */
.det{overflow:auto}
.det .pad{padding:0 20px 20px}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.dh .sym{font-size:30px;font-weight:800;letter-spacing:-1px;font-family:var(--mono)}
.dh .px{font-size:26px;font-weight:800;text-align:right;font-family:var(--mono)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.kv div{background:var(--soft);border-radius:12px;padding:9px 11px}
.kv b{display:block;font-size:15px;font-family:var(--mono)}
.gauge{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:6px 0 2px}
.gauge i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--warn),var(--up))}
.chart svg{width:100%;height:190px;display:block}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:12px;color:var(--ink2)}
.note h3{margin:0 0 6px;font-size:12px;color:var(--ink)}
.li{display:flex;gap:8px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.li:last-child{border:0}
.li.k{flex-direction:column;gap:3px;justify-content:flex-start}.li.k .h{display:flex;gap:8px;align-items:baseline;min-width:0}.li.k .h button{flex:none;font-weight:800;font-family:var(--mono)}
.li.k .h .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink3);font-size:12px}.li.k .h .r{flex:none;font-family:var(--mono);font-size:12px;color:var(--ink2)}
.li.k .s{color:var(--ink3);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--ink3);text-align:center;padding:30px 0}
.bk{display:none;margin:12px 20px 0;padding:6px 12px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700;width:max-content}

/* 모바일 */
.mnav{display:none}
@media (max-width:1250px){.grid{grid-template-columns:300px minmax(0,1fr)}.det{grid-column:1/-1;max-height:none}}
@media (max-width:760px){
  .app{padding:12px 12px 78px;gap:12px}
  .sess,.dots span:not(:first-child){display:none}
  .grid{display:flex;flex-direction:column}
  .card.tape,.card.board,.card.det{display:none}
  body[data-v=radar] .card.board,body[data-v=tape] .card.tape,body[data-v=det] .card.det{display:flex}
  
  .tiles{padding:2px 12px 14px}
  .focus{grid-template-columns:1fr;gap:10px}.rest{grid-template-columns:1fr 1fr;gap:8px}
  .tile.f .sy{font-size:19px}.tile.f .px b{font-size:18px}
  .acct{flex-wrap:wrap;padding:2px}.acct>div{flex:1 1 45%;padding:11px 14px;border-left:0!important}.acct .spark{display:none}
  .acct .v{font-size:21px}.acct>div:nth-child(3),.acct .hold{border-top:1px solid var(--line)}.acct .hold{min-width:0}.posc{min-width:0;width:100%}.posc .ph .lab{display:none}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:9}
  .mnav button{flex:1;padding:10px 0;font-weight:700;font-size:13px;color:var(--ink3);border-radius:12px}
  .mnav button.on{color:var(--ink);background:var(--soft)}
  .tape .list{max-height:none}
  .ch{flex-wrap:wrap}.ch .sub{display:none}.ch .r{margin-left:auto}.seg button{padding:5px 9px;white-space:nowrap}
  .det .pad{padding:0 14px 20px}
}

/* 보기 전환 */
.vnav{display:flex;gap:4px;margin-left:8px}
.vnav button{padding:7px 16px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink3)}
.vnav button:hover{background:var(--card)}.vnav button.on{background:var(--ink);color:var(--card)}
.view{display:none;gap:16px;grid-template-columns:minmax(0,1fr);align-content:start}
body[data-view=trade] #v-trade,body[data-view=cond] #v-cond,body[data-view=set] #v-set{display:grid}
body:not([data-view=radar]) .grid{display:none}
.view .pad{padding:2px 20px 18px}
.view .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.view .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.view .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.view .split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media (max-width:1100px){.view .three,.view .split{grid-template-columns:minmax(0,1fr)}}
.hb{display:grid;grid-template-columns:118px 1fr 104px;gap:10px;align-items:center;font-size:12.5px;padding:5px 0}
.hb>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .t{height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}.hb .t i{display:block;height:100%;background:linear-gradient(90deg,var(--down),var(--up))}
.hb .t i.u{background:var(--up)}.hb .t i.d{background:var(--down)}.hb em{font-style:normal;font-family:var(--mono);color:var(--ink3);font-size:11.5px;text-align:right}
.hist{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:6px}
.hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:10.5px;color:var(--ink3)}
.hist i{display:block;width:100%;border-radius:5px 5px 2px 2px;min-height:2px}.hist i.u{background:var(--up);opacity:.8}.hist i.d{background:var(--down);opacity:.8}
.srow>span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srow{display:grid;grid-template-columns:minmax(0,1.4fr) 54px 1fr 80px 70px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}.srow:last-child{border:0}
.srow.h{font-size:11px;color:var(--ink3);font-weight:600;padding-top:0}
.srow .t{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.srow .t i{display:block;height:100%;background:linear-gradient(90deg,var(--down),var(--up))}
.tag.off{color:var(--ink3);background:var(--soft)}
.best{display:grid;gap:6px}.best .b{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:12.5px}.best .b small{color:var(--ink3);margin-left:6px}
.sub2{font-size:11px;color:var(--ink3);font-weight:600;margin:12px 0 4px}.sub2:first-child{margin-top:0}
.ctiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ctile{background:var(--soft);border-radius:14px;padding:12px 14px;border:0;text-align:left;cursor:pointer;display:grid;gap:3px;color:var(--ink)}
.ctile .h{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}.ctile .m{font-size:11.5px;color:var(--ink3)}
.csum{display:grid;grid-template-columns:110px 1fr 58px 58px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}.csum:last-child{border:0}
.csum .tops{display:flex;gap:6px;flex-wrap:wrap}.csum .tops span{background:var(--soft);border-radius:8px;padding:2px 7px;font-size:11.5px;font-family:var(--mono)}
.csum.on b{color:var(--acc)}
.setrow small{display:block;font-size:11px;color:var(--ink3);margin-top:2px}

.view .kpi{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 20px}
.kpi .k{font-size:12px;color:var(--ink3);font-weight:600}.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.8px;font-family:var(--mono)}.kpi .n{font-size:12px;color:var(--ink3)}
.card.bar{flex-direction:row;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{background:var(--soft);padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.inl{display:flex;gap:6px}.inl input,.form input{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;min-width:0}
.pillbtn{padding:7px 14px;border-radius:999px;background:var(--soft);font-weight:700;font-size:13px}
.pillbtn:hover{filter:brightness(.96)}.pillbtn.warn{background:color-mix(in srgb,var(--warn) 20%,var(--soft));color:#9a6a00}.pillbtn.warn.on{background:var(--warn);color:#fff}
.pillbtn.danger{background:color-mix(in srgb,var(--up) 14%,var(--soft));color:var(--up)}
.bell{padding:4px 8px;border-radius:999px;opacity:.4;font-size:13px}.bell.on{opacity:1;background:var(--soft)}
.bigchart{width:100%;height:220px;display:block}
.poslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pcard{min-width:0;max-width:100%;background:var(--soft);border-radius:14px;padding:14px 16px;text-align:left}
.pcard .h{display:flex;justify-content:space-between;align-items:baseline}.pcard .h b{font-family:var(--mono);font-size:17px}
.pcard .g{height:7px;border-radius:4px;background:var(--line);margin:10px 0 3px;overflow:hidden}.pcard .g i{display:block;height:100%;background:linear-gradient(90deg,var(--down),var(--up))}
.pcard .sc{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
.pcard .m{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;color:var(--ink3);font-weight:600;font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}.tbl tr:last-child td{border:0}
.tbl .r{text-align:right}.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--soft)}
.tscroll{max-height:420px;overflow:auto}
.wrapseg{flex-wrap:wrap;border-radius:16px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}.setrow:last-child{border:0}
.setrow b{display:block;font-size:13.5px}.setrow span{font-size:12px;color:var(--ink3)}
.sw{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--ink)}.sw:checked::after{left:21px}
.form{display:grid;gap:12px}.form label{display:grid;gap:5px;font-size:12px;color:var(--ink3);font-weight:600}.form .pillbtn{justify-self:start}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.stgrid div{background:var(--soft);border-radius:12px;padding:9px 12px}.stgrid .k{font-size:11px;color:var(--ink3)}.stgrid b{font-size:14px}
.csbar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 120px;gap:12px;align-items:center;padding:6px 0;font-size:12.5px}
.csbar .t{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.csbar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--down),var(--up))}
.cdots{display:inline-flex;gap:3px;vertical-align:middle}
.cdots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.cdots i.y{background:var(--ok)}.cdots i.s{background:var(--ink3);opacity:.4}
.cdots+.mono{white-space:nowrap}
.ev.new{background:color-mix(in srgb,var(--up) 9%,var(--card));animation:nw 2.4s ease-out 1}
@keyframes nw{0%{background:color-mix(in srgb,var(--up) 28%,var(--card))}100%{background:color-mix(in srgb,var(--up) 9%,var(--card))}}
.perf{display:grid;grid-template-columns:78px 1fr 86px;gap:10px;align-items:center;font-size:12.5px;padding:5px 0}
.perf .t{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.perf .t i{display:block;height:100%;background:linear-gradient(90deg,var(--down),var(--up))}
.perf em{font-style:normal;font-family:var(--mono);color:var(--ink3);font-size:11.5px;text-align:right;white-space:nowrap}
.view .cols{display:grid}.view .cols.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.view .cols.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.view .cols>div{min-width:0;padding-bottom:6px}.view .cols>div+div{border-left:1px solid var(--line)}
.view .kpis.flat{gap:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-bottom:1px solid var(--line)}
.view .kpis.flat .kpi{background:none;box-shadow:none;border-radius:0;padding:16px 20px}.view .kpis.flat .kpi+.kpi{border-left:1px solid var(--line)}
.view .kpis.flat .kpi .v{font-size:21px}
.view .note{background:none;padding:12px 0 0;margin-top:12px;border-top:1px solid var(--line)}
.view .stgrid{display:flex;flex-wrap:wrap;gap:8px 32px}.view .stgrid div{background:none;padding:0}
.view .ctile{background:none}
@media (max-width:1100px){.view .cols.c2,.view .cols.c3{grid-template-columns:minmax(0,1fr)}.view .cols>div+div{border-left:0;border-top:1px solid var(--line)}}
[hidden]{display:none!important}
@media (max-width:1100px){.vnav{display:none}}
@media (max-width:760px){
  .view .two,.view .kpis,.view .kpis.flat{grid-template-columns:1fr 1fr}.view .kpis.flat .kpi:nth-child(odd){border-left:0}.view .two{grid-template-columns:1fr}.srow{grid-template-columns:1fr 44px 90px}.srow>:nth-child(3),.srow>:nth-child(5){display:none}.csum{grid-template-columns:90px 1fr 44px 44px}
  .bar .spacer{display:none}.csbar{grid-template-columns:1fr 70px}.csbar .t{grid-column:1/-1;order:3}
  .poslist{grid-template-columns:1fr}.tscroll{max-height:none}
  .mnav button{font-size:12px}
  body[data-view=radar][data-v=det] .card.det{display:flex}
}

<script>
"use strict";
const $=id=>document.getElementById(id);
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const api=async p=>{const r=await fetch(p);if(!r.ok)throw new Error(p);return r.json()};
const NS="http://www.w3.org/2000/svg";
const sv=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fpx=v=>v==null||isNaN(v)?"-":v>=10?v.toFixed(2):v>=1?v.toFixed(2):v.toFixed(4);
const fpct=(v,d=1)=>v==null||isNaN(v)?"-":(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d)+"%";
const fusd=(v,s)=>v==null?"-":(s&&v>0?"+":v<0?"−":"")+"$"+Math.abs(v).toLocaleString("en-US",{maximumFractionDigits:2,minimumFractionDigits:2});
const tone=v=>v>0?"up":v<0?"dn":"";
const SESS={PRE:"프리마켓",REGULAR:"정규장",POST:"애프터",CLOSED:"장 마감",DAY:"데이마켓"};
const kst=s=>new Date(s).toLocaleTimeString("ko-KR",{timeZone:"Asia/Seoul",hour:"2-digit",minute:"2-digit",hour12:false});
const KIND={precursor:["급등 전조","up"],burst:["거래 터짐","warn"],reaccel:["재가속","up"],approach:["고점 접근","up"],bottom_bounce:["바닥 반등","up"],steady:["꾸준 상승","up"],
  halt:["거래 정지","acc"],spike_up:["급등","up"],spike_dn:["급락","dn"],filing:["공시",""]};
const HOT=k=>["precursor","burst","reaccel","approach","bottom_bounce","steady","halt","spike_up"].includes(k);

let sel=null,tf="hot",bf="all",events=[],pre=[];

/* 색: 등락률 → 파랑~회색~빨강 */
function heat(c){
  const m=Math.max(-1,Math.min(1,(c||0)/30));
  const mix=(a,b,t)=>a.map((x,i)=>Math.round(x+(b[i]-x)*t));
  const g=[128,136,158],r=[229,56,74],b=[47,109,240];
  const rgb=m>=0?mix(g,r,m):mix(g,b,-m);
  return `rgb(${rgb})`;
}

/* ---------- 상단 · 계좌 ---------- */
async function loadOv(){
  const [ov,eq,det,pos]=await Promise.all([api("/api/overview"),api("/api/equity").catch(()=>[]),api("/api/detections?hours=36").catch(()=>({rows:[]})),api("/api/positions").catch(()=>[])]);
  const nxt=ov.next_change?Math.max(0,Math.round((new Date(ov.next_change)-Date.now())/60000)):null;
  $("sess").textContent=SESS[ov.session]||ov.session||"-";
  $("sess2").textContent=(ov.trade_date||"")+(nxt!=null?` · 다음 전환 ${Math.floor(nxt/60)}시간 ${nxt%60}분`:"");
  $("t-mode").textContent=ov.mode==="live"?"실거래":"모의매매";
  const ta=ov.trader&&ov.trader.age_s;$("d-tr").className=ta!=null&&ta<60?"g":"r";
  const ca=ov.collector&&ov.collector.last_price_ts?(Date.now()-new Date(ov.collector.last_price_ts+(/Z|\+/.test(ov.collector.last_price_ts)?"":"Z")))/1000:null;
  $("d-co").className=ca!=null&&(ca<180||ov.session==="CLOSED")?"g":"r";$("t-co").textContent=ca==null?"수집기 -":ca<180?"수집기 정상":`수집기 ${Math.round(ca/60)}분 전`;
  const e=ov.equity||{};
  $("eq").textContent=fusd(e.equity);$("eq2").textContent=e.cash!=null?`현금 ${fusd(e.cash)}`:"";
  const dp=e.day_pnl;$("dp").textContent=fusd(dp,true);$("dp").className="v mono "+tone(dp);$("dp2").textContent=ov.trade_date?`영업일 ${ov.trade_date}`:"";
  // 스파크라인
  const s=$("spark");s.replaceChildren();
  if(eq.length>1){const v=eq.map(x=>x.equity),lo=Math.min(...v),hi=Math.max(...v),W=400,H=64;
    const pts=v.map((y,i)=>[i/(v.length-1)*W,H-6-(y-lo)/(hi-lo||1)*(H-14)]);
    const d="M"+pts.map(p=>p.join(",")).join("L");
    const col=v[v.length-1]>=v[0]?css("--up"):css("--down");
    const gr=sv("linearGradient",{id:"g1",x1:0,y1:0,x2:0,y2:1},s);sv("stop",{offset:0,"stop-color":col,"stop-opacity":.28},gr);sv("stop",{offset:1,"stop-color":col,"stop-opacity":0},gr);
    sv("path",{d:d+`L${W},${H}L0,${H}Z`,fill:"url(#g1)"},s);sv("path",{d,fill:"none",stroke:col,"stroke-width":2.2,"stroke-linejoin":"round","vector-effect":"non-scaling-stroke"},s);}
  const done=det.rows.filter(r=>r.result==="win"||r.result==="loss"),win=done.filter(r=>r.result==="win").length,p=done.length?win/done.length*100:null;
  $("ringv").textContent=p==null?"-":Math.round(p)+"%";$("ringv").className="v mono "+(p==null?"":p>=50?"up":"dn");
  $("ring2").textContent=done.length?`${win}적중 · ${done.length-win}손절 (알림 ${det.rows.length}건)`:"집계 중";
  // 보유
  const pb=$("pos");pb.replaceChildren();
  pos.forEach(x=>{const c=mk("button","posc");const r=x.unrealized_pct;
    const h=mk("div","ph");h.append(mk("b",null,x.symbol),mk("span","mono "+tone(r),fpct(r)),mk("span","lab mono",`${fpx(x.entry_price)} → ${fpx(x.last)}`));c.appendChild(h);
    if(x.stop&&x.target&&x.last){const b=mk("div","pbar"),i=mk("i");i.style.width=Math.max(0,Math.min(1,(x.last-x.stop)/(x.target-x.stop)))*100+"%";b.appendChild(i);c.appendChild(b);
      const sc=mk("div","psc");sc.append(mk("span",null,"손절 "+fpx(x.stop)),mk("span",null,"익절 "+fpx(x.target)));c.appendChild(sc)}
    c.onclick=()=>pick(x.symbol);pb.appendChild(c)});
  if(!pos.length)pb.appendChild(mk("span","mut","보유·대기 없음"));
}

/* ---------- 테이프 ---------- */
async function loadTape(){
  events=await api("/api/events?limit=200");checkNew(events);drawTape();
}
function drawTape(){
  const box=$("tape");box.replaceChildren();

  Object.entries(bs).forEach(([k,o])=>hbar(sn,(SRULE[k]||[k])[0].replace(/^[^\s]+\s/,""),o.c?o.w/o.c:0,o.c?`${Math.round(o.w/o.c*100)}% · ${o.c}건`:`${o.n}건 진행`));
  if(!Object.keys(bs).length)sn.append(mk("div","empty","가상 매매 기록 없음"));sb.appendChild(sn);
  const ws=mk("div","note");ws.append(mk("h3",null,"가상 실험 매매 요약"));
  const cl=v.filter(x=>x.status==="CLOSED"),w=cl.filter(x=>x.exit_price>x.entry).length;
  ws.append(mk("div",null,`전체 ${v.length}건 · 청산 ${cl.length}건${cl.length?` · 이익 ${w}건 (${Math.round(w/cl.length*100)}%)`:""}`));ub.appendChild(ws);
}
$("set-va").onsubmit=e=>{e.preventDefault();postSet({vaccount:{capital:+$("set-cap").value,per_trade:+$("set-per").value}}).then(()=>{$("set-va-msg").textContent="저장됨";setTimeout(()=>$("set-va-msg").textContent="",2000)}).catch(x=>alert(x.message))};
$("set-flt").onsubmit=e=>{e.preventDefault();const sd={};["DAY","PRE","REGULAR","AFTER"].forEach(k=>{sd[k]=+$("set-sd-"+k).value||0});
  postSet({sweep_min_dollar:sd,universe_max_mcap:+$("set-mcap").value||0,universe_min_adv:+$("set-adv").value||0}).then(()=>{$("set-flt-msg").textContent="저장됨 (감시 목록은 다음 갱신 때 반영)";setTimeout(()=>$("set-flt-msg").textContent="",3000)}).catch(x=>alert(x.message))};

/* ===== 실시간 가격 (SSE) ===== */
let livePx={},liveDirty=false;
(function liveConnect(){
  if(!window.EventSource)return;
  const es=new EventSource("/api/live");
  es.onmessage=ev=>{try{Object.assign(livePx,JSON.parse(ev.data));liveDirty=true}catch(e){}};
  es.onerror=()=>{es.close();setTimeout(liveConnect,3000)};
})();
setInterval(()=>{
  if(!liveDirty||!pre.length)return;liveDirty=false;
  for(const x of pre){const p=livePx[x.symbol];if(!p)continue;const n=x.now||(x.now={});
    if(!n.ts||p[1]>n.ts){n.price=p[0];n.ts=p[1];if(x.close)n.chg=(p[0]/x.close-1)*100}}
  if(document.body.dataset.view==="radar"&&!(document.body.dataset.v==="det"&&window.innerWidth<=760)){const t=$("tiles"),y=t.scrollTop;drawBoard();t.scrollTop=y}
},2000);

/* ===== 새 중요 신호 알림 (소리 · 강조) ===== */
let soundOn=false,seenTs=null;
try{soundOn=localStorage.getItem("pb-sound")==="1"}catch(e){}
$("bell").classList.toggle("on",soundOn);
$("bell").onclick=()=>{soundOn=!soundOn;$("bell").classList.toggle("on",soundOn);try{localStorage.setItem("pb-sound",soundOn?"1":"0")}catch(e){}if(soundOn)beep()};
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.value=.07;o.start();o.stop(a.currentTime+.16)}catch(e){}}
function checkNew(rows){
  const hot=rows.filter(e=>HOT(e.kind));const newest=hot.length?hot[0].ts:null;
  window._newSet=new Set();
  if(seenTs&&newest&&newest>seenTs){hot.filter(e=>e.ts>seenTs).forEach(e=>window._newSet.add(e.ts+e.symbol+e.kind));if(soundOn)beep()}
  if(newest)seenTs=newest;
}

/* ===== 신호별 적중률 ===== */
async function perfCard(){
  const d=await api("/api/detections?hours=36").catch(()=>null);if(!d||!d.stats)return null;
  const rows=Object.entries(KIND).map(([k,[n]])=>[n,d.stats[k]]).filter(([n,x])=>x&&x.n);
  if(!rows.length)return null;
  const n=mk("div","note");n.append(mk("h3",null,"신호 종류별 적중률 (+20% 먼저 도달)"));
  rows.forEach(([name,x])=>{const p=x.win/x.n*100,r=mk("div","perf"),t=mk("div","t"),i=mk("i");i.style.width=p+"%";t.appendChild(i);r.append(mk("span",null,name),t,mk("em",null,`${Math.round(p)}% · ${x.n}건`));n.appendChild(r)});
  return n;
}

const safe=f=>f().catch(e=>console.warn(e));
function refresh(){safe(loadOv);safe(loadTape);safe(loadBoard)}
refresh();showHome();{const h=decodeURIComponent(location.hash.slice(1));if(["trade","cond","set"].includes(h))setView(h,"radar");else if(h)pick(h)}setInterval(refresh,15000);
